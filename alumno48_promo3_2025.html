            background-color: #f5f5f5;
            color: #333;
            font-family: 'Arial', sans-serif;

        .header {
            background-image: url('https://i.postimg.cc/2y3vMpbd/imagen-de-fondo.jpg');
            background-size: cover;
            background-position: center;
            height: 80vh;
            text-align: center;
            padding-top: 200px;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        }

        .header p {
            font-size: 1.5rem;
            color: #FFFFFF;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        }

        .section-title {
            text-align: center;
            margin-top: 50px;
            font-size: 2.5rem;
            color: #000000;

            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }

        .product-card {
            width: 30%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            transition: transform 0.3s ease;
        }

        .product-card img {
            width: 100%;
            height: auto;
            border-bottom: 2px solid #eee;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card h4 {
            text-align: center;
            padding: 15px;
            font-size: 1.5rem;
        }

        .contact-form {
            background-color: #ff6f61;
            padding: 40px;
            color: white;
            border-radius: 10px;
            margin-top: 50px;
        }

        .contact-form h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .social-links {
            text-align: center;
            margin-top: 30px;
        }

        .social-links img {
            width: 50px;
            margin: 0 10px;
            transition: opacity 0.3s ease;

    <style>

<style>
    .product-card {
        position: relative;

        border-radius: 50px;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .whatsapp-container:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateX(-50%) scale(1.05);
    }

    .whatsapp-container img {
        width: 30px;
        height: 30px;
        margin-right: 10px;
    }

    .whatsapp-text {

<script>
    function solicitarPedido(nombrePastel) {
        window.dataLayer = window.dataLayer || [];
        dataLayer.push({
            'event': 'solicitar_pedido',
            'Pastel': nombrePastel
        });

        // Redirige a WhatsApp
        window.location.href = "https://wa.me/c/51941453659";
    }
</script>

    <!-- Formulario de Contacto -->
    <div class="contact-form">
        <h3>Inscríbete a nuestro cursos aquí</h3>
        <form id="contactForm">
            <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="phone" required>
            </div>
            <button type="submit" class="btn btn-light w-100">Enviar Pedido</button>
        </form>
    </div>
