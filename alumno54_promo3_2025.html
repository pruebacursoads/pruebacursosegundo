    <style>
        body {
            background-color: #f5f5f5;
            color: #333;
            font-family: 'Arial', sans-serif;
        }

        .header {
            background-image: url('https://i.postimg.cc/2y3vMpbd/imagen-de-fondo.jpg');
            background-size: cover;
            background-position: center;
            height: 80vh;
            text-align: center;
            padding-top: 200px;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        }

        .header p {
            font-size: 1.5rem;
            color: #FFFFFF;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        }

        .section-title {
            text-align: center;
            margin-top: 50px;
            font-size: 2.5rem;
            color: #000000;
        }

        .product-gallery {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }

        .product-card {
            width: 30%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            transition: transform 0.3s ease;
        }

        .product-card img {
            width: 100%;
            height: auto;
            border-bottom: 2px solid #eee;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card h4 {
            text-align: center;
            padding: 15px;
            font-size: 1.5rem;
        }

        .contact-form {
            background-color: #ff6f61;
            padding: 40px;
            color: white;
            border-radius: 10px;
            margin-top: 50px;
        }

        .contact-form h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .social-links {
            text-align: center;
            margin-top: 30px;
        }

        .social-links img {
            width: 50px;
            margin: 0 10px;
            transition: opacity 0.3s ease;
        }

        .social-links img:hover {
            opacity: 0.8;
        }
    </style>
    <title>Repostería Gourmet - Pasteles Personalizados</title>

    <!-- Header Section -->
    <div class="header">
        <h1>Bienvenidos a The Queen Bee Pastelería</h1>
        <p>Pastelería creativa y artesanal</p>
    </div>

    <!-- Galería de Productos -->
    <div class="section-title">
        <h2>Nuestros Pasteles</h2>
    </div>
    <div class="product-gallery">
        <div class="product-card">
            <img src="https://i.postimg.cc/rmBr8Vpj/nuestro-matrimonio.png">
            <h4>Pastel de Pre-Novias</h4>
        </div>
        <div class="product-card">
            <img src="https://i.postimg.cc/qRPRpg17/thequeenbee-cumple.png" alt="Pastel 2">
            <h4>Pastel de Cumpleaños</h4>
        </div>
        <div class="product-card">
            <img src="https://i.postimg.cc/85y5syc5/vanguardismo-fotopastel.png" alt="Pastel 3">
            <h4>Pastel Temático en Tendencia</h4>
        </div>
    </div>

    <!-- Redes Sociales -->
    <div class="social-links">
        <h3>Síguenos en nuestras redes sociales</h3>
        <a href="https://www.instagram.com/thequeenbee.pe/" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/5/58/Instagram-Icon.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/thequeenbee.pe" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook"></a>

        <a href="https://www.youtube.com/@thequeenbeepasteleria" target="_blank"><img src="https://i.postimg.cc/6qSYx22Q/youtube-png.png" alt="Youtube"></a>
